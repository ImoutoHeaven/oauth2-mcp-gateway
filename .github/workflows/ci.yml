name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**", "wip/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

  debian:
    name: test (debian-bookworm)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Debian container build and tests
        run: |
          docker run --rm --init -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e CARGO_BUILD_JOBS=2 -e CARGO_TERM_COLOR=always -e DEBIAN_FRONTEND=noninteractive \
            rust:1.92-slim-bookworm sh -ec '
              apt-get update
              apt-get install -y --no-install-recommends gcc libc6-dev python3 ca-certificates
              rustup component add rustfmt clippy
              cargo fmt --check
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked
            '

  alpine:
    name: test (alpine-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Alpine container build and tests
        run: |
          docker run --rm --init -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e CARGO_BUILD_JOBS=2 -e CARGO_TERM_COLOR=always \
            rust:1.92.0-alpine3.23 sh -ec '
              apk add --no-cache build-base python3 ca-certificates
              rustup component add rustfmt clippy
              cargo fmt --check
              cargo clippy --locked --all-targets -- -D warnings
              cargo test --locked
            '

  freebsd:
    name: test (freebsd-15.1-amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: native FreeBSD build and tests
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          arch: x86_64
          mem: 6144
          cpu: 4
          prepare: |
            pkg install -y rust python3
          run: |
            set -eu
            run_script=$(mktemp ./ci-freebsd-run.XXXXXX)
            trap 'rm -f "$run_script"' EXIT
            cat > "$run_script" <<'FREEBSD'
            set -eu
            export CARGO_TARGET_DIR=/tmp/oauth2-mcp-gateway-target
            export CARGO_BUILD_JOBS=2
            freebsd-version
            rustc --version
            cargo fmt --check
            cargo clippy --locked --all-targets -- -D warnings
            cargo test --locked
            FREEBSD
            if sh "$run_script" > ci-freebsd.log 2>&1; then
              status=0
            else
              status=$?
            fi
            printf '%s\n' "$status" > ci-freebsd-exit-code.txt
            cat ci-freebsd.log

      - name: FreeBSD test result
        if: always()
        run: |
          if [ ! -f ci-freebsd-exit-code.txt ]; then
            echo "::error::The FreeBSD VM did not return a test result."
            exit 1
          fi
          if [ "$(cat ci-freebsd-exit-code.txt)" != 0 ]; then
            echo "::error::FreeBSD verification failed; see the test log artifact."
            exit 1
          fi

      - name: test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-freebsd-15.1-amd64
          path: |
            ci-freebsd.log
            ci-freebsd-exit-code.txt
          if-no-files-found: ignore
