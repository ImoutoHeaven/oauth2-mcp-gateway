[package]
name = "oauth2-mcp-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "OAuth 2.1 sidecar authentication gateway for HTTP and stdio MCP servers"
repository = "https://github.com/ImoutoHeaven/oauth2-mcp-gateway"
readme = "README.md"

[dependencies]
base64 = "0.22"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
form_urlencoded = "1.2"
getrandom = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "native-tokio"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11.1"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
